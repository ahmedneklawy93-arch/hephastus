# Render Blueprint for Hephastus (the WhatsApp assistant in ./hephastus).
# In Render: New > Blueprint > pick this repository. Render asks for each
# value marked "sync: false"; see hephastus/README.md for where to find them.
services:
  - type: web
    name: hephastus
    runtime: node
    plan: free
    rootDir: hephastus
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: MODEL
        value: claude-opus-5-5
