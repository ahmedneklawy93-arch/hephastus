# Render Blueprint for Hephastus (the browser chat assistant in ./hephastus).
# In Render: New > Blueprint > pick this repository. Render asks for each
# value marked "sync: false"; see hephastus/README.md for where to find them.
services:
  - type: web
    name: hephastus
    runtime: node
    plan: free
    rootDir: hephastus
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: MODEL
        value: claude-opus-5-5
      # The accounting books (general ledger) live in this Postgres database.
      - key: DATABASE_URL
        fromDatabase:
          name: hephastus-db
          property: connectionString

databases:
  # A paid plan: Render deletes free databases after 30 days, which is not safe for books.
  - name: hephastus-db
    plan: basic-256mb
    databaseName: hephastus
    user: hephastus
